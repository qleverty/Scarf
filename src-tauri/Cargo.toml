[package]
name = "scarf"
version = "1.0.0"
edition = "2024"

[lib]
name = "scarf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "scarf"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
actix-web = "4"
actix-multipart = "0.7"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
mime_guess = "2"
bytes = "1"
futures-util = "0.3"
url = "2"
